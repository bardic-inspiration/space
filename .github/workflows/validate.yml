# The one check on a pull request: types, the unit tests (host conformance and
# parity with core's recorded matches among them), the build, and the built
# site driven in headless Chromium. `npm run validate` runs the same locally.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Core is a git dependency pinned to a commit, and npm's lockfile names it over ssh.
      # A private core needs a token with read access to it, as the secret CORE_READ_TOKEN.
      - name: Fetch core over https
        env:
          CORE_READ_TOKEN: ${{ secrets.CORE_READ_TOKEN }}
        run: |
          if [ -n "$CORE_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${CORE_READ_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          else
            git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
