# CI — the merge gate. docs/ci.md says what it must do, and why.
#
# The gate is one command, `check` (AGENTS.md "Commands") — here
# `npm run validate`: types, the unit tests, the build, and the built site
# driven in headless Chromium. You, agents, and CI all run it. A Markdown-only
# diff skips setup and check, but the job still runs and reports green, so
# `gate` can be a required status check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
          fi

          if [ -z "$BASE" ] || [ -z "$HEAD" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "No comparable base commit (new branch, force-push, or manual run) — running full checks."
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE...$HEAD")"
          echo "Changed files:"
          echo "$CHANGED"

          if [ -z "$CHANGED" ] || printf '%s\n' "$CHANGED" | grep -qvE '\.md$'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Markdown-only diff — skipping setup and check (docs/ci.md)."
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version: 22
          cache: npm

      # Core is a git dependency pinned to a commit, and the lockfile names it
      # over ssh. A private core needs a token with read access to it, as the
      # secret CORE_READ_TOKEN.
      - name: Fetch core over https
        if: steps.changes.outputs.docs_only != 'true'
        env:
          CORE_READ_TOKEN: ${{ secrets.CORE_READ_TOKEN }}
        run: |
          if [ -n "$CORE_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${CORE_READ_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          else
            git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          fi

      - name: Install
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.changes.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium

      - name: Check
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run validate
